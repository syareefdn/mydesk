<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | AI Library</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            max-width: 500px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: #e2e8f0;
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-size: 24px;
            color: #1e293b;
            margin: 16px 0;
        }
        .error-message {
            color: #64748b;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">500</h1>
        <h2 class="error-title">Kesalahan Server</h2>
        <p class="error-message">Maaf, terjadi kesalahan di server. Silakan coba lagi nanti.</p>
        <a href="/" class="btn">Kembali ke Beranda</a>
    </div>
</body>
</html>
